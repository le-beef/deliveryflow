<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width"><title>Configurar DeliveryFlow PDV</title><style>*{box-sizing:border-box}body{margin:0;background:#f3f1ec;color:#24221f;font:16px Segoe UI,Arial;display:grid;place-items:center;min-height:100vh}.card{width:min(520px,92vw);background:white;border-radius:24px;padding:34px;box-shadow:0 20px 60px #0002}.brand{color:#ff6333;font-weight:900;letter-spacing:.08em}h1{font-size:28px;margin:8px 0}p{color:#69655f;line-height:1.5}label{display:grid;gap:7px;font-weight:700;margin:18px 0}input{padding:13px;border:1px solid #d9d5ce;border-radius:10px;font-size:16px}.row{display:grid;grid-template-columns:1fr 130px;gap:12px}button{width:100%;padding:14px;border:0;border-radius:11px;background:#ff6333;color:white;font-size:16px;font-weight:800;cursor:pointer}.status{min-height:22px;margin-top:14px;font-size:14px}.error{color:#b52f20}.ok{color:#207244}.hint{background:#fff6f0;border-radius:12px;padding:12px;font-size:14px}</style></head><body><form class="card" id="form"><span class="brand">DELIVERYFLOW PDV</span><h1>Conectar ao servidor</h1><p>Este computador será um terminal. Informe o IP exibido no DeliveryFlow Servidor.</p><label>Nome deste terminal<input id="name" value="Caixa 1" required placeholder="Ex.: Caixa 1"></label><div class="row"><label>IP do servidor<input id="host" required placeholder="192.168.1.10"></label><label>Porta<input id="port" type="number" value="3030" required></label></div><div class="hint">O servidor e este computador precisam estar conectados à mesma rede.</div><button>Testar, salvar e entrar</button><div class="status" id="status"></div></form><script>const form=document.querySelector('#form'),status=document.querySelector('#status');async function boot(){const info=await window.deliveryflowDesktop.networkInfo();if(info.configured){document.querySelector('#name').value=info.terminalName;document.querySelector('#host').value=info.serverHost;document.querySelector('#port').value=info.serverPort;try{await window.deliveryflowDesktop.testNetwork(info);status.className='status ok';status.textContent='Servidor encontrado. Abrindo o PDV...';await window.deliveryflowDesktop.launchNetwork();}catch{status.className='status error';status.textContent='Servidor salvo não está acessível. Confira os dados.';}}}form.addEventListener('submit',async e=>{e.preventDefault();status.className='status';status.textContent='Procurando o servidor...';const data={terminalName:document.querySelector('#name').value.trim(),serverHost:document.querySelector('#host').value.trim(),serverPort:Number(document.querySelector('#port').value)};try{await window.deliveryflowDesktop.testNetwork(data);await window.deliveryflowDesktop.configureNetwork(data);status.className='status ok';status.textContent='Conectado. Abrindo o PDV...';await window.deliveryflowDesktop.launchNetwork();}catch(error){status.className='status error';status.textContent=error.message||'Servidor não encontrado.';}});boot();</script></body></html>
